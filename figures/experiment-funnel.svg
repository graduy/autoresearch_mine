<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#475569"/></marker></defs><rect width="1800" height="1000" fill="#FFFFFF"/><text x="900" y="58" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="34px" font-weight="700" fill="#1F2937">Budget-aware experiment funnel and evidence boundary</text><text x="900" y="95" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="20px" font-weight="400" fill="#1F2937">The system spends expensive compute only after cheaper evidence passes</text><rect x="110" y="210" width="300" height="150" rx="18" fill="#E8F1FB" stroke="#334155" stroke-width="3"/><text x="260.0" y="273.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">Idea pool</text><text x="260.0" y="304.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">source + prediction</text><rect x="510" y="210" width="300" height="150" rx="18" fill="#FFF3D6" stroke="#334155" stroke-width="3"/><text x="660.0" y="273.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">Smoke</text><text x="660.0" y="304.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">cheap failure filter</text><rect x="910" y="210" width="300" height="150" rx="18" fill="#E8F5E9" stroke="#334155" stroke-width="3"/><text x="1060.0" y="273.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">Verify</text><text x="1060.0" y="304.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">multiple seeds</text><rect x="1310" y="210" width="300" height="150" rx="18" fill="#E8F5E9" stroke="#334155" stroke-width="3"/><text x="1460.0" y="273.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">Full</text><text x="1460.0" y="304.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">fixed budget</text><path d="M410,285 C460,285 460,285 510,285" fill="none" stroke="#475569" stroke-width="4"  marker-end="url(#arrow)"/><path d="M810,285 C860,285 860,285 910,285" fill="none" stroke="#475569" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1210,285 C1260,285 1260,285 1310,285" fill="none" stroke="#475569" stroke-width="4"  marker-end="url(#arrow)"/><rect x="910" y="540" width="300" height="150" rx="18" fill="#F1E8FA" stroke="#334155" stroke-width="3"/><text x="1060.0" y="603.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">Independent test</text><text x="1060.0" y="634.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">separate from selection</text><rect x="1310" y="540" width="300" height="150" rx="18" fill="#FDEBEC" stroke="#334155" stroke-width="3"/><text x="1460.0" y="603.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">Paper claim</text><text x="1460.0" y="634.0" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="24px" font-weight="600" fill="#1F2937">only verified numbers</text><path d="M1460,360 C1260,360 1260,540 1060,540" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/><path d="M1210,615 C1260,615 1260,615 1310,615" fill="none" stroke="#475569" stroke-width="4"  marker-end="url(#arrow)"/><text x="160" y="520" text-anchor="start" font-family="DejaVu Sans,Arial" font-size="21px" font-weight="700" fill="#1F2937">Not a claim</text><text x="160" y="555" text-anchor="start" font-family="DejaVu Sans,Arial" font-size="19px" font-weight="400" fill="#1F2937">Hypothesis and predicted gain</text><text x="160" y="590" text-anchor="start" font-family="DejaVu Sans,Arial" font-size="19px" font-weight="400" fill="#1F2937">are stored before the run</text><text x="900" y="820" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="25px" font-weight="600" fill="#1F2937">Pilot selects candidates; multi-seed and independent testing support claims.</text><text x="900" y="865" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="21px" font-weight="400" fill="#1F2937">A missing artifact remains TBD; the writer cannot synthesize a result.</text></svg>